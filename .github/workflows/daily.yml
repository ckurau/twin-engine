name: Daily run (after the close)
# Books today's paper fills at the real closing prices and updates the dashboard.
# Started on time by cron-job.org (4:20 PM New York time); the UTC schedule is a backup.
# Two UTC times cover both DST offsets; the engine ignores today's prices until 4:15 PM ET
# and a second run on the same day changes nothing, so running twice is safe.
on:
  schedule:
    - cron: "20 20 * * 1-5"   # 4:20 PM EDT (3:20 PM EST: too early, no-op)
    - cron: "20 21 * * 1-5"   # 4:20 PM EST (5:20 PM EDT: already done, no-op)
  workflow_dispatch:
permissions:
  contents: write
  issues: write       # closes the day's order notification once the close is booked
concurrency:
  group: twin-engine-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run engine
        run: |
          set -o pipefail
          if [ ! -f state.json ]; then echo "::error::No account yet. Run the 'Start account' workflow first."; exit 1; fi
          python twin_engine.py run | tee run.log || { echo '::warning::Run failed - retrying with the newest yfinance'; pip install -q -U yfinance; python twin_engine.py run | tee run.log; }
          { echo '```'; cat run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json summary.json
          if git diff --cached --quiet state.json && [ "${{ github.event_name }}" = "schedule" ]; then echo "No new close booked."; exit 0; fi
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Daily run $(TZ=America/New_York date +%F)"; for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; sleep $((i * 5)); done; git push
      - name: Close today's order notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          booked=$(python -c "import json; print(json.load(open('state.json'))['last_date'])")
          for n in $(gh issue list --state open --search "Orders in:title" --json number,title --jq ".[] | select(.title | startswith(\"Orders \")) | select(.title[7:17] <= \"$booked\") | .number"); do
            gh issue close "$n" --comment "Booked at the $booked close. See the dashboard's Trades tab." || true
          done
