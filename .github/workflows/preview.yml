name: Preview orders (before the close)
# Runs ~45 min before the close and lists the market-on-close orders to place today.
# GitHub cron is UTC and can start 10-30 min late, so there is one entry per DST offset
# (and two more for 1:00 PM early closes). The engine itself checks the NYSE calendar
# and only runs 5-65 min before today's close, so the extra entries do nothing.
on:
  schedule:
    - cron: "15 19 * * 1-5"   # 3:15 PM EDT
    - cron: "15 20 * * 1-5"   # 3:15 PM EST
    - cron: "15 16 * * 1-5"   # 12:15 PM EDT (early-close days)
    - cron: "15 17 * * 1-5"   # 12:15 PM EST (early-close days)
  workflow_dispatch:            # "Run workflow" button: runs right away, any time
permissions:
  contents: write
  issues: write
concurrency:
  group: twin-engine
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preview today's orders
        id: pv
        run: python twin_engine.py preview ${{ github.event_name == 'schedule' && '--window' || '' }}
      - name: Show on the run page
        if: steps.pv.outputs.ran == '1'
        run: cat preview.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish preview.json to the dashboard
        if: steps.pv.outputs.ran == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview.json
          git diff --cached --quiet || { git commit -m "Preview ${{ steps.pv.outputs.date }}"; git pull --rebase; git push; }
      - name: Notify (GitHub issue -> phone notification)
        if: steps.pv.outputs.ran == '1' && steps.pv.outputs.orders != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n@%s' "${{ github.repository_owner }}" >> preview.md
          gh issue create --title "Orders ${{ steps.pv.outputs.date }}: ${{ steps.pv.outputs.orders }} MOC order(s)" --body-file preview.md
